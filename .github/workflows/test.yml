name: SEO & Performance Tests

# PR-only: pushes to main are covered by the same tests inside deploy.yml,
# where they gate the deployment. Triggering on push here too would just build
# the site a second time in parallel.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep pinned in sync with deploy.yml, package.json and .nvmrc.
      - name: Install and build
        uses: withastro/action@v6
        with:
          package-manager: pnpm@11.17.0
          node-version: 24

      - name: Run SEO tests
        run: pnpm run test:seo

      - name: Start preview server
        run: pnpm preview > preview.log 2>&1 &
        env:
          HOST: localhost
          PORT: 4321

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -fs http://localhost:4321 > /dev/null; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Server failed to start"
          exit 1

      - name: Run performance tests
        run: pnpm run test:performance

      - name: Preview server log
        if: failure()
        run: cat preview.log || true
